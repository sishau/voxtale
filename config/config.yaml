server:
  path: ~/workspace/voxtale/storage/text/temp.txt
  encoding: utf-8
tts:
  # --- kokoro v1.1 multilingual, zh female zf_047 (current) ---
  model_folder: ./models/kokoro-multi-lang-v1_1
  model: model.onnx
  voices: voices.bin
  lexicon: lexicon-us-en.txt, lexicon-zh.txt
  data_dir: espeak-ng-data
  tokens: tokens.txt
  rule_fsts: phone-zh.fst, number-zh.fst, date-zh.fst
  sid: 30
  speed: 1.3
  num_threads: 2
