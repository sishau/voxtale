server:
  path: ~/workspace/voxtale/storage/text/temp.txt
  encoding: utf-8
tts:
  # --- zh-en bilingual (current) ---
  model_folder: ./models/matcha-icefall-zh-en
  model: model-steps-3.onnx
  vocoder: vocos-16khz-univ.onnx
  lexicon: lexicon.txt
  data_dir: espeak-ng-data
  tokens: tokens.txt
  rule_fsts: phone-zh.fst, number-zh.fst, date-zh.fst
  sid: 0
  speed: 1.15
