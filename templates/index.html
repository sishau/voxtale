<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>音频播放器</title>
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 720px; margin: 0 auto; padding: 16px; }
        #status { font-size: 13px; color: #666; margin: 10px 0; }
        #displayText { white-space: pre-wrap; line-height: 1.6; }
    </style>
</head>
<body>
    <audio controls id="audioPlayer"></audio>
    <div id="status">连接中...</div>
    <label><input type="checkbox" id="textSync">同步显示文本</label>
    <div id="displayText"></div>

    <script>
        var socket = io();
        var audioPlayer = document.getElementById('audioPlayer');
        var statusEl = document.getElementById('status');
        var textSyncEl = document.getElementById('textSync');

        var MAX_BUFFER = 3;
        var buffer = [];          // 已接收、待播放的块
        var pendingRequests = 0;  // 在途请求数, 精确限制预取总量
        var currentItem = null;   // 当前装载在播放器中的块
        var playing = false;
        var bookEnded = false;

        // 记住文本同步开关
        textSyncEl.checked = localStorage.getItem('textSync') === '1';
        textSyncEl.addEventListener('change', setTextSync);

        function setTextSync() {
            localStorage.setItem('textSync', textSyncEl.checked ? '1' : '0');
            socket.emit('text_sync', textSyncEl.checked);
            if (textSyncEl.checked && currentItem && currentItem.text) {
                document.getElementById('displayText').textContent = currentItem.text;
            } else if (!textSyncEl.checked) {
                document.getElementById('displayText').textContent = '';
            }
        }

        function requestIfNeeded() {
            if (bookEnded) return;
            while (buffer.length + pendingRequests < MAX_BUFFER) {
                pendingRequests++;
                socket.emit('request_next_audio');
            }
        }

        function resetState() {
            buffer = [];
            pendingRequests = 0;
            currentItem = null;
            playing = false;
            bookEnded = false;
            audioPlayer.removeAttribute('src');
            audioPlayer.load();
            document.getElementById('displayText').textContent = '';
        }

        function playNext() {
            if (playing || currentItem !== null || buffer.length === 0) return;
            currentItem = buffer.shift();
            playing = true;
            if (textSyncEl.checked && currentItem.text && !currentItem.isEnd) {
                document.getElementById('displayText').textContent = currentItem.text;
            }
            var url = URL.createObjectURL(currentItem.blob);
            audioPlayer.src = url;
            var p = audioPlayer.play();
            if (p && p.catch) {
                p.catch(function() {
                    // 自动播放被浏览器拦截: 块已装载, 等待用户点击播放
                    playing = false;
                });
            }
        }

        audioPlayer.addEventListener('ended', function() {
            if (!currentItem) return;
            URL.revokeObjectURL(audioPlayer.src);
            var item = currentItem;
            currentItem = null;
            playing = false;
            if (item.isEnd) return;  // 书末语音提示播完即止
            socket.emit('chunk_played', {
                chapterIndex: item.chapterIndex,
                position: item.position
            });
            playNext();
            requestIfNeeded();
        });

        // 暂停/切走页面时也上报进度, 避免中途暂停后重载丢进度
        function reportProgress() {
            if (currentItem && !currentItem.isEnd) {
                socket.emit('chunk_played', {
                    chapterIndex: currentItem.chapterIndex,
                    position: currentItem.position
                });
            }
        }
        audioPlayer.addEventListener('pause', reportProgress);
        window.addEventListener('pagehide', reportProgress);
        window.addEventListener('beforeunload', reportProgress);
        document.addEventListener('visibilitychange', function() {
            if (document.hidden) reportProgress();
        });

        audioPlayer.addEventListener('error', function() {
            // 解码失败: 跳过该块(不回报进度, 避免跳读)
            var item = currentItem;
            currentItem = null;
            playing = false;
            if (item && item.isEnd) {
                bookEnded = true;
                pendingRequests = 0;
                statusEl.textContent = '全书朗读完毕';
                return;
            }
            playNext();
            requestIfNeeded();
        });

        socket.on('connect', function() {
            statusEl.textContent = '已连接';
            resetState();
            requestIfNeeded();
        });

        socket.on('disconnect', function() {
            statusEl.textContent = '连接已断开, 重连中...';
        });

        socket.on('audio_data', function(data) {
            pendingRequests--;
            var blob = data.audio instanceof Blob
                ? data.audio
                : new Blob([data.audio], { type: 'audio/wav' });
            var item = {
                blob: blob,
                chapterIndex: data.chapterIndex,
                position: data.position,
                text: data.text,
                isEnd: !!data.isEnd
            };
            buffer.push(item);
            if (item.isEnd) {
                bookEnded = true;
                pendingRequests = 0;
                statusEl.textContent = '全书朗读完毕';
            } else {
                statusEl.textContent = '播放中 · 第' + (data.chapterIndex + 1) + '章';
            }
            playNext();
            requestIfNeeded();
        });

        socket.on('audio_end', function() {
            bookEnded = true;
            pendingRequests = 0;
            statusEl.textContent = '全书朗读完毕';
        });

        socket.on('text_data', function(text) {
            document.getElementById('displayText').textContent = text;
        });
    </script>
</body>
</html>
