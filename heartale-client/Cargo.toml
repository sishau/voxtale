[package]
name = "heartale-client"
version = "0.1.0"
edition = "2021"
description = "Heartale 悬浮朗读窗 (Rust 版)"

[dependencies]
eframe = "0.29"
rodio = "0.20"
reqwest = { version = "0.12", features = ["blocking"] }
rust_socketio = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
global-hotkey = "0.6"
percent-encoding = "2"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_Controls",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 2
strip = true
